services:
  postgres:
    image: postgres:16-alpine
    container_name: gologin-postgres
    environment:
      POSTGRES_USER: kyo
      POSTGRES_PASSWORD: tientda1
      POSTGRES_DB: first_db
    ports:
      - "5432:5432"
    volumes:
      - gologin-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyo -d first_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gologin-data:
